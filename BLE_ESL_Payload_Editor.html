<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLE ESL Payload Layout Editor (imagespec)</title>
  <link rel="stylesheet" href="imagespec-editor/editor.css">
</head>

<body>

  <div class="header">
    <h1>⬡ BLE ESL Layout Editor <span style="font-size:11px;color:var(--text2)">imagespec</span></h1>
    <div class="separator"></div>
    <label>Device</label>
    <select id="deviceSelect">
      <option value="200,200">1.54" 200×200 · Zhsunyco / Poshiji</option>
      <option value="212,104">2.1" 212×104 BWR · Gicisky</option>
      <option value="250,132">2.1" 250×132 BW TFT · Gicisky</option>
      <option value="250,128">2.1" 250×128 BWR · Gicisky</option>
      <option value="250,122">2.13" 250×122 · Zhsunyco / Poshiji</option>
      <option value="296,152">2.66" 296×152 · Zhsunyco / Poshiji</option>
      <option value="296,128" selected>2.9" 296×128 · Gicisky / Zhsunyco / Poshiji</option>
      <option value="384,184">3.5" 384×184 · Zhsunyco / Poshiji</option>
      <option value="240,416">3.7" 240×416 BWR · Gicisky</option>
      <option value="416,240">3.7" 416×240 BWRY · Zhsunyco / Poshiji</option>
      <option value="400,300">4.2" 400×300 · Gicisky / Zhsunyco / Poshiji</option>
      <option value="648,480">5.8" 648×480 · Zhsunyco</option>
      <option value="800,480">7.5" 800×480 · Gicisky / Zhsunyco / Poshiji</option>
      <option value="960,640">10.2" 960×640 · Gicisky / Zhsunyco</option>
      <option value="960,680">13.3" 960×680 BWRY · Zhsunyco</option>
    </select>
    <label>Background</label>
    <select id="bgSelect">
      <option value="white">White</option>
      <option value="black">Black</option>
      <option value="red">Red</option>
      <option value="yellow">Yellow</option>
    </select>
    <label>Rotate</label>
    <select id="rotateSelect">
      <option value="0">0°</option>
      <option value="90">90°</option>
      <option value="180">180°</option>
      <option value="270">270°</option>
    </select>
  </div>

  <div class="toolbar" id="toolbar">
    <span>Add:</span>
  </div>

  <div class="main">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="canvas"></canvas>
    </div>
    <div class="sidebar">
      <h2>📋 Elements</h2>
      <div id="elementList" class="element-list">
        <div class="no-elements">Click a button above to add elements</div>
      </div>
      <div class="props" id="propsPanel">
        <h2>⚙️ Properties</h2>
        <div id="propsContent" class="prop-group">
          <div class="no-elements">Select an element</div>
        </div>
      </div>
    </div>
  </div>

  <div class="yaml-wrap">
    <div class="yaml-header">
      <h2>📄 YAML Output / Input</h2>
      <div>
        <button class="btn" onclick="importYaml()" title="Paste YAML below and click Import">📥 Import</button>
        <button class="btn copy" onclick="copyYaml()">📋 Copy</button>
      </div>
    </div>
    <textarea id="yaml-output" spellcheck="false">action: ble_esl.write
data:
  payload: []
target:
  device_id: &lt;your device&gt;</textarea>
  </div>

  <div class="coord-tooltip" id="coordTooltip"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="imagespec-editor/schema.js"></script>
  <script src="imagespec-editor/profiles/ble_esl.js"></script>
  <script src="imagespec-editor/core.js"></script>
</body>

</html>
