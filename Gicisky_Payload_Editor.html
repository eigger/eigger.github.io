<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gicisky Payload Layout Editor (imagespec)</title>
  <link rel="stylesheet" href="imagespec-editor/editor.css">
</head>

<body>

  <div class="header">
    <h1>⬡ Gicisky Layout Editor <span style="font-size:11px;color:var(--text2)">imagespec</span></h1>
    <div class="separator"></div>
    <label>Device</label>
    <select id="deviceSelect">
      <option value="250,132">TFT 2.1" BW (250×132)</option>
      <option value="250,128">EPD 2.1" BWR (250×128)</option>
      <option value="296,128" selected>EPD 2.9" BWR (296×128)</option>
      <option value="296,128">EPD 2.9" BWRY (296×128)</option>
      <option value="400,300">EPD 4.2" BWR (400×300)</option>
      <option value="400,300">EPD 4.2" BWRY (400×300)</option>
      <option value="800,480">EPD 7.5" BWR (800×480)</option>
      <option value="960,640">EPD 10.2" BWR (960×640)</option>
    </select>
    <label>Background</label>
    <select id="bgSelect">
      <option value="white">White</option>
      <option value="black">Black</option>
      <option value="red">Red</option>
      <option value="yellow">Yellow</option>
    </select>
    <label>Rotate</label>
    <select id="rotateSelect">
      <option value="0">0°</option>
      <option value="90">90°</option>
      <option value="180">180°</option>
      <option value="270">270°</option>
    </select>
  </div>

  <div class="toolbar" id="toolbar">
    <span>Add:</span>
  </div>

  <div class="main">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="canvas"></canvas>
    </div>
    <div class="sidebar">
      <h2>📋 Elements</h2>
      <div id="elementList" class="element-list">
        <div class="no-elements">Click a button above to add elements</div>
      </div>
      <div class="props" id="propsPanel">
        <h2>⚙️ Properties</h2>
        <div id="propsContent" class="prop-group">
          <div class="no-elements">Select an element</div>
        </div>
      </div>
    </div>
  </div>

  <div class="yaml-wrap">
    <div class="yaml-header">
      <h2>📄 YAML Output / Input</h2>
      <div>
        <button class="btn" onclick="importYaml()" title="Paste YAML below and click Import">📥 Import</button>
        <button class="btn copy" onclick="copyYaml()">📋 Copy</button>
      </div>
    </div>
    <textarea id="yaml-output" spellcheck="false">action: gicisky.write
data:
  payload: []
target:
  device_id: &lt;your device&gt;</textarea>
  </div>

  <div class="coord-tooltip" id="coordTooltip"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="imagespec-editor/schema.js"></script>
  <script src="imagespec-editor/profiles/gicisky.js"></script>
  <script src="imagespec-editor/core.js"></script>
</body>

</html>
